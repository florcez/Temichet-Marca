    <main>
        <form>
            <section class="encuesta">
                <label for="correo">Email (opcional)</label>
                <input type="email" id="correo">

                <label for="encontrar">¿Cómo encontraste esta página?</label>
                <select name="encontrar" id="encontrar" required>
                  <option value="">Por favor elegir una opción</option>
                  <option value="redes">Redes sociales</option>
                  <option value="publicidad">Publicidad</option>
                  <option value="contacto">Amigo/a, familiar o conocido</option>
                  <option value="otro">Otro</option>
                </select>

                <label for="producto">¿Qué productos quisieras ver? (opcional)</label>
                <input type="text" id="producto" required>


                <label>Experiencia en la página</label>
                

                <div class="opciones_radio">
                  <div class="input_radio">
                    <input type="radio" name="experiencia" id="excelente">
                    <label for="excelente">Excelente</label>
                  </div>

                  <div class="input_radio">
                    <input type="radio" name="experiencia" id="buena">
                    <label for="buena">Buena</label>
                  </div>

                  <div class="input_radio">
                    <input type="radio" name="experiencia" id="regular">
                    <label for="regular">Regular</label>
                  </div>

                  <div class="input_radio">
                    <input type="radio" name="experiencia" id="mala">
                    <label for="mala">Mala</label>
                  </div>

                  <div class="input_radio">
                    <input type="radio" name="experiencia" id="muymala">
                    <label for="muymala">Muy mala</label>
                  </div>
                </div>


                <label for="comment">Comentario (opcional)</label>
                <textarea type="text" id="comment"></textarea>

                
                <button  type="submit">Enviar</button>
            </section>
        </form>

    </main>
